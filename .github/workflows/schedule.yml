name: 测试 Secrets

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 测试环境变量
        env:
          MY_TOKEN: ${{ secrets.my_token }}
          FRIEND_TO: ${{ secrets.test_token }}
        run: |
          echo "MY_TOKEN 长度: ${#MY_TOKEN}"
          echo "FRIEND_TO 长度: ${#FRIEND_TO}"
          
          if [ -n "$MY_TOKEN" ]; then
            echo "✓ MY_TOKEN 有值"
          else
            echo "✗ MY_TOKEN 为空"
          fi
          
          if [ -n "$FRIEND_TO" ]; then
            echo "✓ FRIEND_TO 有值"
          else
            echo "✗ FRIEND_TO 为空"
          fi
