name: 定时任务

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 执行任务
        env:
          MY_TOKEN: ${{ secrets.my_token }}
          TEST_TOKEN: ${{ secrets.test_token }}
        run: |
          echo "=========================================="
          echo "任务开始时间（UTC）：$(date -u)"
          echo "任务开始时间（北京时间）：$(TZ='Asia/Shanghai' date)"
          echo "=========================================="
          
          if [ -n "$MY_TOKEN" ]; then
            echo "✓ MY_TOKEN 已设置"
          else
            echo "✗ MY_TOKEN 未设置"
            exit 1
          fi
          
          if [ -n "$TEST_TOKEN" ]; then
            echo "✓ TEST_TOKEN 已设置，将发送给好友"
            TO_PARAM="\"to\": \"$TEST_TOKEN\","
          else
            echo "⚠️ TEST_TOKEN 未设置，将发给自己"
            TO_PARAM=""
          fi
          
          echo "正在发送消息..."
          
          # 获取北京时间作为消息内容
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          RESPONSE=$(curl -s -X POST "https://www.pushplus.plus/api/send" \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$MY_TOKEN\",
              $TO_PARAM
              \"title\": \"每日提醒\",
              \"content\": \"执行时间（北京时间）：${BEIJING_TIME}\\n定时任务运行成功！\",
              \"template\": \"txt\"
            }")
          
          echo "API 响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✓ 消息发送成功！"
          else
            echo "✗ 消息发送失败"
            exit 1
          fi
          
          echo "=========================================="
          echo "任务完成时间（UTC）：$(date -u)"
          echo "任务完成时间（北京时间）：$(TZ='Asia/Shanghai' date)"
          echo "=========================================="
