name: 定时任务

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 执行任务
        env:
          MY_TOKEN: ${{ secrets.my_token }}
          TEST_TOKEN: ${{ secrets.test_token }}
        run: |
          echo "任务开始时间：$(date)"
          
          # 验证 Secrets 是否正确设置
          echo "正在验证 Secrets 配置..."
          
          if [ -n "$MY_TOKEN" ]; then
            echo "✓ my_token 已设置"
          else
            echo "✗ my_token 未设置"
          fi
          
          if [ -n "$TEST_TOKEN" ]; then
            echo "✓ test_token 已设置"
          else
            echo "✗ test_token 未设置"
          fi
          
          # 如果两个 Token 都为空，则退出
          if [ -z "$MY_TOKEN" ] && [ -z "$TEST_TOKEN" ]; then
            echo "错误：没有任何 Token 被设置，请检查 GitHub Secrets 配置"
            exit 1
          fi
          
          # 发送测试消息（优先使用 MY_TOKEN）
          echo "正在发送测试消息..."
          
          TOKEN_TO_USE="${MY_TOKEN:-$TEST_TOKEN}"
          
          # 调用 PushPlus API
          RESPONSE=$(curl -s -X POST "https://www.pushplus.plus/api/send" \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$TOKEN_TO_USE\",
              \"title\": \"GitHub Actions 测试通知\",
              \"content\": \"✅ 定时任务运行成功！\\n\\n任务执行时间：$(date)\\nSecrets 状态：my_token=$([ -n "$MY_TOKEN" ] && echo '已设置' || echo '未设置'), test_token=$([ -n "$TEST_TOKEN" ] && echo '已设置' || echo '未设置')\",
              \"template\": \"txt\"
            }")
          
          echo "API 响应：$RESPONSE"
          
          # 检查发送结果
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✓ 消息发送成功！"
          else
            echo "✗ 消息发送失败，请检查 Token 是否正确"
            exit 1
          fi
          
          echo "任务完成时间：$(date)"
