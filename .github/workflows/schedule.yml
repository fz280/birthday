name: 定时任务

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.4'
      
      - name: 运行 Python 脚本
        env:
          MY_TOKEN: ${{ secrets.my_token }}
          TEST_TOKEN: ${{ secrets.test_token }}
        run: |
          python birthday.py